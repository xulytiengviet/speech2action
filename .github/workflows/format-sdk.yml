name: Format Speech2Action Python SDK
on:
  push:
    branches: [main]
    paths:
      - 'robot_voice_sdk/**'
      - 'tests/test_chess_adapter.py'
      - 'tests/test_robot_voice_sdk.py'
      - '.github/workflows/format-sdk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff pinned formatter
        run: |
          python -m pip install 'ruff==0.15.10'
          ruff format robot_voice_sdk tests/test_robot_voice_sdk.py tests/test_chess_adapter.py
      - name: Commit formatting only if needed
        run: |
          if git diff --quiet -- robot_voice_sdk tests/test_robot_voice_sdk.py tests/test_chess_adapter.py; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robot_voice_sdk tests/test_robot_voice_sdk.py tests/test_chess_adapter.py
          git commit -m "style: apply Ruff formatting to Speech2Action SDK"
          git push origin HEAD:main
